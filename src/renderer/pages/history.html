<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>History</title>
  <link rel="icon" href="/assets/ember-app-icon.png">
  <link rel="stylesheet" href="/theme.css" />
  <link rel="stylesheet" href="/history.css" />
  <link rel="stylesheet" href="/liquid-glass-ui.css" />
</head>
<body class="native-glass-page">
  <!-- Kept as the fallback wash for anywhere the window material is missing;
       liquid-glass-ui.css hides it wherever the native backdrop is live. -->
  <div class="ambient" aria-hidden="true">
    <span class="blob blob-a"></span>
    <span class="blob blob-b"></span>
    <span class="blob blob-c"></span>
  </div>

  <header class="topbar">
    <div class="brandline">
      <button class="back-home" id="back-home" type="button" title="Back to New Tab" aria-label="Back to New Tab">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M12.5 4.5 7 10l5.5 5.5" /></svg>
      </button>
      <img class="mark" src="/assets/ember-icon.png" alt="" />
      <h1>History</h1>
    </div>
    <button id="delete-data" class="pill lg-button lg-accent" data-lg>Delete browsing data…</button>
  </header>

  <div class="search-row">
    <div class="search" data-lg>
      <svg class="search-icon" viewBox="0 0 16 16" aria-hidden="true">
        <circle cx="7" cy="7" r="4.6" /><path d="M10.6 10.6L14 14" />
      </svg>
      <input id="search" type="search" autocomplete="off" spellcheck="false"
             placeholder="Search history" aria-label="Search history" />
      <button id="clear-search" class="clear" hidden aria-label="Clear search">×</button>
    </div>
    <button id="date-filter" class="pill lg-button lg-sm compact-only" data-lg>Filter by date</button>
  </div>

  <main class="layout">
    <aside class="sidebar" data-lg>
      <h2 class="side-title">Filter by Date</h2>
      <label class="side-item lg-button lg-sm" for="date-input" data-lg>
        <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="3" width="12" height="11" rx="2"/><path d="M2 6.5h12M5.5 2v2M10.5 2v2"/></svg>
        <span id="date-label">Pick the date</span>
        <input id="date-input" type="date" aria-label="Filter by date" />
      </label>

      <h2 class="side-title">Navigate to</h2>
      <nav class="side-nav" id="side-nav"></nav>
    </aside>

    <section class="results" id="results" aria-live="polite"></section>
  </main>

  <footer class="compact-footer compact-only" data-lg>
    <button id="full-view" class="pill lg-button wide" data-lg>Open Full History View</button>
  </footer>

  <script src="/liquid-glass-ui.js"></script>
  <script src="/history.js"></script>
</body>
</html>
