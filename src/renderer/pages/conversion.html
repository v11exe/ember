<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' data:; script-src 'self'" />
  <title>Conversion</title>
  <link rel="stylesheet" href="/theme.css" />
  <link rel="stylesheet" href="/overlay-liquid-glass.css" />
  <link rel="stylesheet" href="/conversion.css" />
</head>
<body>
  <div class="shell" id="shell" data-liquid-glass="base" role="dialog" aria-label="Converted value">
    <img class="overlay-liquid-glass__backdrop" id="backdrop" alt="" />

    <div class="content">
      <div class="from" id="from"></div>
      <div class="to" id="to"></div>
      <div class="note" id="note" hidden></div>
      <div class="copy-depth">
        <button class="copy" id="copy" data-liquid-glass="control" type="button">Copy</button>
      </div>
    </div>
  </div>

  <script src="/backdrop-contrast.js"></script>
  <script src="/overlay-liquid-glass.js"></script>
  <script src="/conversion.js"></script>
</body>
</html>
