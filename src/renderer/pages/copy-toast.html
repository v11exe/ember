<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'" />
  <title>Link copied</title>
  <link rel="stylesheet" href="/theme.css" />
  <link rel="stylesheet" href="/copy-toast.css" />
</head>
<body>
  <div class="copy-toast" id="copy-toast" role="status" aria-live="polite">
    <span class="copy-toast-mark" aria-hidden="true">✓</span>
    <span class="copy-toast-label">Link copied</span>
    <span class="copy-toast-progress" aria-hidden="true"></span>
  </div>
  <script src="/copy-toast.js"></script>
</body>
</html>
