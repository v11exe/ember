<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Page unavailable</title>
  <link rel="icon" href="/assets/ember-app-icon.png">
  <link rel="stylesheet" href="/theme.css" />
  <link rel="stylesheet" href="/history.css" />
  <link rel="stylesheet" href="/unreachable.css" />
  <link rel="stylesheet" href="/liquid-glass-ui.css" />
</head>
<body class="native-glass-page">
  <div class="ambient" aria-hidden="true">
    <span class="blob blob-a"></span>
    <span class="blob blob-b"></span>
    <span class="blob blob-c"></span>
  </div>

  <main class="unreachable">
    <section class="panel" data-lg>
      <h1>This page couldn't be reached</h1>
      <p class="address" id="address"></p>
      <p class="reason" id="reason"></p>

      <div class="choices">
        <button class="pill lg-button" data-lg id="retry">Retry</button>
        <button class="pill lg-button" data-lg id="archived">View archived version</button>
      </div>
      <p class="status" id="status" role="status"></p>
    </section>
  </main>

  <script src="/liquid-glass-ui.js"></script>
  <script src="/unreachable.js"></script>
</body>
</html>
