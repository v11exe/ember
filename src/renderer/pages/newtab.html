<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: https:; style-src 'self'; font-src 'self'; script-src 'self'" />
  <title>Ember</title>
  <link rel="stylesheet" href="/theme.css" />
  <link rel="stylesheet" href="/brand.css" />
  <link rel="stylesheet" href="/newtab.css" />
</head>
<body class="native-glass-page">
  <div class="ambient" aria-hidden="true">
    <span class="blob blob-a"></span>
    <span class="blob blob-b"></span>
    <span class="blob blob-c"></span>
  </div>

  <main class="hero">
    <div class="logo" id="ember-brand"></div>
    <p class="tagline">Private by default · Search runs on Google</p>

    <div id="native-liquid-glass"></div>

    <nav class="tiles" id="tiles"></nav>

    <footer class="foot">
      <button data-store>Get extensions</button>
      <span class="dot">·</span>
      <span>Searches run on Google</span>
    </footer>
  </main>

  <script src="/brand.js"></script>
  <script src="/liquid-glass-search.js"></script>
  <script src="/newtab.js"></script>
</body>
</html>
