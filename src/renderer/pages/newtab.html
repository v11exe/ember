<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: https:; style-src 'self'; font-src 'self'; script-src 'self'" />
  <title>Ember</title>
  <link rel="stylesheet" href="/theme.css" />
  <link rel="stylesheet" href="/brand.css" />
  <link rel="stylesheet" href="/newtab.css" />
</head>
<body>
  <div class="ambient" aria-hidden="true">
    <span class="blob blob-a"></span>
    <span class="blob blob-b"></span>
    <span class="blob blob-c"></span>
  </div>

  <main class="hero">
    <div class="logo" id="ember-brand"></div>
    <p class="tagline">Private by default · Search runs on Google</p>

    <form class="search" id="search-form" role="search" data-glass>
      <svg class="search-icon" viewBox="0 0 16 16" aria-hidden="true">
        <circle cx="7" cy="7" r="4.5" /><path d="M10.5 10.5L14 14" />
      </svg>
      <input id="q" type="text" autocomplete="off" spellcheck="false" autofocus
             placeholder="Search Google or type a URL" aria-label="Search" />
      <button type="submit" class="go">Search</button>
    </form>

    <nav class="tiles" id="tiles"></nav>

    <footer class="foot">
      <button data-store>Get extensions</button>
      <span class="dot">·</span>
      <span>Searches run on Google</span>
    </footer>
  </main>

  <script src="/brand.js"></script>
  <script src="/upload-optics.js"></script>
  <script src="/page-glass.js"></script>
  <script src="/newtab.js"></script>
</body>
</html>
