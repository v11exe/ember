<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: https:; style-src 'self'; script-src 'self'" />
  <title>Ember Favorites</title>
  <link rel="stylesheet" href="theme.css" />
  <link rel="stylesheet" href="shell-material.css" />
  <link rel="stylesheet" href="sidebar.css" />
</head>
<body>
  <aside class="sidebar-surface shell-material shell-edge shell-edge-sidebar" aria-label="Favorite sites">
    <div class="sidebar-content">
      <form class="sidebar-address" id="sidebar-address">
        <input id="sidebar-address-input" type="text" aria-label="Address" spellcheck="false" autocomplete="off" />
        <button class="sidebar-address-copy" id="sidebar-address-copy" type="button" aria-label="Copy current link" title="Copy current link">
          <img src="assets/copy-link.png" alt="" />
        </button>
      </form>
      <div class="favorites" id="favorites"></div>
    </div>
  </aside>
  <script src="shell-metrics.js"></script>
  <script src="sidebar.js"></script>
</body>
</html>
