<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Ember</title>
  <link rel="stylesheet" href="theme.css" />
  <link rel="stylesheet" href="chrome.css" />
</head>
<body>
  <div class="chrome-shell">
  <header class="tabstrip" id="tabstrip">
    <div class="brand" title="Ember">
      <span class="brand-spark"></span>
    </div>
    <div class="tabs" id="tabs"></div>
    <button class="tab-new" id="new-tab" title="New tab (Ctrl+T)">+</button>
    <div class="drag-fill"></div>
    <div class="window-controls">
      <button id="win-min" class="wc" title="Minimize"><svg viewBox="0 0 10 10"><path d="M0 5h10" /></svg></button>
      <button id="win-max" class="wc" title="Maximize"><svg viewBox="0 0 10 10"><rect x="0.5" y="0.5" width="9" height="9" /></svg></button>
      <button id="win-close" class="wc wc-close" title="Close"><svg viewBox="0 0 10 10"><path d="M0 0l10 10M10 0L0 10" /></svg></button>
    </div>
  </header>

  <div class="toolbar">
    <div class="nav">
      <button id="back" class="icon" title="Back"><svg viewBox="0 0 16 16"><path d="M10 3L5 8l5 5" /></svg></button>
      <button id="forward" class="icon" title="Forward"><svg viewBox="0 0 16 16"><path d="M6 3l5 5-5 5" /></svg></button>
      <button id="reload" class="icon" title="Reload"><svg viewBox="0 0 16 16"><path d="M13 8a5 5 0 1 1-1.5-3.5M13 2v3h-3" /></svg></button>
    </div>

    <form class="omnibox" id="omnibox-form">
      <span class="omnibox-glyph" id="omnibox-glyph"></span>
      <input id="omnibox" type="text" spellcheck="false" autocomplete="off"
             placeholder="Search with Google or enter address" />
    </form>

    <div class="actions">
      <button id="ext-btn" class="icon" title="Extensions" aria-haspopup="true" aria-expanded="false">
        <svg viewBox="0 0 24 24" class="jigsaw"><path d="M19.439 7.85c-.049.322.059.648.289.878l1.568 1.568c.47.47.706 1.087.706 1.704s-.235 1.233-.706 1.704l-1.611 1.611a.98.98 0 0 1-.837.276c-.47-.07-.802-.48-.968-.925a2.501 2.501 0 1 0-3.214 3.214c.446.166.855.497.925.968a.979.979 0 0 1-.276.837l-1.61 1.61a2.404 2.404 0 0 1-1.705.707 2.402 2.402 0 0 1-1.704-.706l-1.568-1.568a1.026 1.026 0 0 0-.877-.29c-.493.074-.84.504-1.02.968a2.5 2.5 0 1 1-3.237-3.237c.464-.18.894-.527.967-1.02a1.026 1.026 0 0 0-.289-.877l-1.568-1.568A2.402 2.402 0 0 1 1.998 12c0-.617.236-1.234.706-1.704L4.23 8.77c.24-.24.581-.353.917-.303.515.077.877.528 1.073 1.01a2.5 2.5 0 1 0 3.259-3.259c-.482-.196-.933-.558-1.01-1.073-.05-.336.062-.676.303-.917l1.525-1.525A2.402 2.402 0 0 1 12 1.998c.617 0 1.234.236 1.704.706l1.568 1.568c.23.23.556.338.877.29.493-.074.84-.504 1.02-.968a2.5 2.5 0 1 1 3.237 3.237c-.464.18-.894.527-.967 1.02z"/></svg>
      </button>
    </div>
  </div>
  </div>



  <script src="chrome.js"></script>
</body>
</html>
